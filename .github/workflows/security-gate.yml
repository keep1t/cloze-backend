name: Security gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-gate:
    name: security-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        run: python3 scripts/install_gitleaks.py

      - name: Verify harness tests
        run: python3 -m unittest discover -s tests

      - name: Scan checked-out files
        run: python3 scripts/security_gate.py worktree

      - name: Scan introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/security_gate.py range "$BASE_SHA" "$HEAD_SHA"
